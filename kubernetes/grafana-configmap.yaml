apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: employeeapp
  labels:
    app.kubernetes.io/name: grafana
data:
  grafana.ini: |
    [server]
    root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana
    serve_from_sub_path = true

    [security]
    admin_user = admin
    admin_password = admin

    [auth.anonymous]
    enabled = false

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: employeeapp
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: admin
  admin-password: admin
