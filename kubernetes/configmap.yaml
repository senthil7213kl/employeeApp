apiVersion: v1
kind: ConfigMap
metadata:
  name: employeeapp-config
  namespace: employeeapp
  labels:
    app.kubernetes.io/name: employeeapp
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "employeedb"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
