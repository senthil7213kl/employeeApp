apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: employeeapp
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files: []

    scrape_configs:
      # Scrape the Employeeapp Spring Boot metrics
      - job_name: 'employeeapp'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              own_namespace: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: employeeapp
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Scrape MySQL metrics (if mysqld_exporter is added later)
      # - job_name: 'mysql'
      #   static_configs:
      #     - targets: ['mysql:9104']
