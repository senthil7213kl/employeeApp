apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: employeeapp
  labels:
    app.kubernetes.io/name: grafana
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.employeeapp.svc.cluster.local:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: '15s'
          httpMethod: POST
