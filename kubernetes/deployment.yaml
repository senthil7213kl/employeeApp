apiVersion: apps/v1
kind: Deployment
metadata:
  name: employeeapp
  namespace: employeeapp
  labels:
    app.kubernetes.io/name: employeeapp
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "0.0.1-SNAPSHOT"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: employeeapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: employeeapp
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "0.0.1-SNAPSHOT"
    spec:
      containers:
        - name: employeeapp
          image: employeeapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: employeeapp-config
            - secretRef:
                name: employeeapp-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
